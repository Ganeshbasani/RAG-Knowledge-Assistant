services:
  - type: web
    name: RAG-Knowledge-Assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RAG_HOST
        value: 0.0.0.0
      - key: RAG_STORAGE_PATH
        value: /app/data/rag-index.json
      - key: RAG_UPLOAD_DIR
        value: /app/data/uploads
      - key: RAG_LLM_PROVIDER
        value: openrouter
      - key: RAG_LLM_MODEL
        value: openrouter/free
      - key: RAG_LLM_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: RAG_RATE_LIMIT_REQUESTS
        value: "12"
      - key: RAG_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RAG_MAX_REQUEST_BYTES
        value: "5242880"
      - key: OPENROUTER_API_KEY
        sync: false
