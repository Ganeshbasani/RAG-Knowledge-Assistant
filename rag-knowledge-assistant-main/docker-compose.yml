services:
  rag-assistant:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_STORAGE_PATH: /app/data/rag-index.json
      RAG_UPLOAD_DIR: /app/data/uploads
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8000
    volumes:
      - rag_data:/app/data

volumes:
  rag_data:
