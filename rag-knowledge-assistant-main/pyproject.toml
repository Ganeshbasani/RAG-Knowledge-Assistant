[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assistant"
version = "1.0.0"
description = "Trust-aware RAG knowledge assistant with hybrid retrieval, grounded generation, citations, and document diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ganesh Basani" }]
keywords = ["rag", "llm", "retrieval", "fastapi", "knowledge-base", "citations", "document-ai"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]
embeddings = [
  "numpy>=1.26",
  "sentence-transformers>=3.1",
]
onnx = [
  "onnxruntime>=1.17",
  "transformers>=4.42",
]

[project.urls]
Source = "https://github.com/Ganeshbasani/RAG-Knowledge-Assistant"
Issues = "https://github.com/Ganeshbasani/RAG-Knowledge-Assistant/issues"

[project.scripts]
rag-knowledge-assistant = "rag_assistant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
